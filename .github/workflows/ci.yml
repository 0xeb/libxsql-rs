name: CI

on:
  push:
    branches: [main]
    tags: ["v*", "V*"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Use bash on all runners (Git Bash on Windows) so the steps are identical.
    shell: bash

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # `--all-features` enables `bundled-sqlite`, so libsqlite3-sys compiles its
      # vendored SQLite — no system-sqlite dependency on Linux/Windows. This also
      # compiles the platform-dependent paths (the `%.16g` export formatting and
      # the sqlite3_vtab_nochange / sqlite3_vtab_rhs_value FFI externs).
      - name: Format
        run: cargo fmt --check --all

      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Docs
        run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Build
        run: cargo build --all-features

      - name: Build examples
        run: cargo build --examples --all-features

      - name: Test
        run: cargo test --all-features

      # Validates the crates.io package (manifest, included files, a clean build
      # of the packaged sources) without uploading anything.
      - name: Package (dry run)
        run: cargo publish --dry-run

  # A version tag publishes a source-only GitHub Release once every platform
  # passes. crates.io publication is separate and not wired here.
  publish-release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: libxsql-rs ${{ github.ref_name }}
          generate_release_notes: true
